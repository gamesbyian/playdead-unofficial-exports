name: Extract resource URL context

on:
  push:
    branches:
      - analysis/resource-url-context-2026-09-29
    paths:
      - tools/extract_resource_context.py
      - .github/workflows/resource-url-context.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract context
        run: python tools/extract_resource_context.py
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/resource-context.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate resource URL context [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
