name: Rank ARG export leads

on:
  push:
    branches:
      - analysis/rank-arg-leads-2026-09-29
    paths:
      - tools/rank_leads.py
      - tools/extract_targeted_leads.py
      - .github/workflows/rank-leads.yml

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rank mined leads
        run: python tools/rank_leads.py

      - name: Extract targeted research ledgers
        run: python tools/extract_targeted_leads.py

      - name: Commit ranked report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ranked-leads.md analysis/sticker-serial-leads.tsv analysis/registration-leads.tsv analysis/external-resource-leads.tsv analysis/targeted-leads.md
          if git diff --cached --quiet; then
            echo "No derived changes."
            exit 0
          fi
          git commit -m "Generate ranked ARG leads [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
