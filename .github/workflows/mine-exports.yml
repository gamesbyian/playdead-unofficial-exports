name: Mine Playdead Discord exports

on:
  push:
    branches:
      - analysis/arg-export-mining-2026-09-29
    paths:
      - tools/mine_exports.py
      - .github/workflows/mine-exports.yml

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mine exported channels and assets
        run: python tools/mine_exports.py

      - name: Commit derived indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/
          if git diff --cached --quiet; then
            echo "No derived changes."
            exit 0
          fi
          git commit -m "Generate Discord export mining indexes [skip ci]"
          git push
