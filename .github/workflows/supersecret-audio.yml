name: Extract superSecret audio evidence

on:
  push:
    branches:
      - analysis/supersecret-audio-2026-09-29
    paths:
      - tools/extract_supersecret_evidence.py
      - .github/workflows/supersecret-audio.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract evidence
        run: python tools/extract_supersecret_evidence.py
      - name: Commit reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supersecret/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate superSecret audio evidence report [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
